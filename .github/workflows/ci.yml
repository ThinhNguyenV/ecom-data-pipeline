name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Job 1: Python Lint
  # ─────────────────────────────────────────
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install lint tools
        run: pip install black isort flake8
      - name: Black check
        run: black --check src/ spark_jobs/ tests/ --line-length=120
      - name: isort check
        run: isort --check-only src/ spark_jobs/ tests/ --profile=black
      - name: Flake8
        run: flake8 src/ spark_jobs/ --max-line-length=120 --extend-ignore=E203,W503

  # ─────────────────────────────────────────
  # Job 2: Python Unit Tests
  # ─────────────────────────────────────────
  test-python:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,quality]"
      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --cov=ecom_pipeline --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────
  # Job 3: dbt Tests (PostgreSQL)
  # ─────────────────────────────────────────
  test-dbt:
    name: dbt Tests
    runs-on: ubuntu-latest
    needs: test-python
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: ecom_dw
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dbt-postgres
        run: pip install dbt-core dbt-postgres
      - name: Init raw schema
        env:
          PGPASSWORD: password
        run: psql -h localhost -U user -d ecom_dw -f deploy/sql/init.sql
      - name: dbt run + test
        env:
          DBT_HOST: localhost
          DBT_USER: user
          DBT_PASSWORD: password
          DBT_DB: ecom_dw
          DBT_PORT: 5432
        run: |
          cd dbt
          dbt deps
          dbt run --profiles-dir .
          dbt test --profiles-dir .

  # ─────────────────────────────────────────
  # Job 4: Spring Boot Build + Tests
  # ─────────────────────────────────────────
  test-backend:
    name: Backend (Java) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run Maven tests
        working-directory: backend
        run: mvn -B test --no-transfer-progress

  # ─────────────────────────────────────────
  # Job 5: Docker Build Validation
  # ─────────────────────────────────────────
  build-docker:
    name: Docker Build (Backend)
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ecom-pipeline-backend:${{ github.sha }} backend/
