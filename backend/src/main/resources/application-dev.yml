# application-dev.yml — Development profile
# Activated with: --spring.profiles.active=dev  OR  SPRING_PROFILES_ACTIVE=dev

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 console useful for local dev introspection
  h2:
    console:
      enabled: false   # we use real PostgreSQL even in dev

logging:
  level:
    com.ecom.pipeline: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"    # expose all actuator endpoints in dev
